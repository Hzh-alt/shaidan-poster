<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>晒单海报生成器</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:#1a1a1a; }
body { margin:0; font-family:"Microsoft YaHei","微软雅黑",-apple-system,"PingFang SC",sans-serif; color:#f5f0e6; }
header { background-color:#8a5a00; background-image:linear-gradient(135deg,#8a5a00,#d4a017); color:#fff; padding:14px 16px; text-align:center; font-size:19px; font-weight:700; letter-spacing:1px; }
.wrap { max-width:560px; margin:0 auto; padding:14px; }
.card { background:#262626; border-radius:14px; padding:14px; margin-bottom:14px; border:1px solid #333; }
.card h2 { margin:0 0 10px; font-size:15px; color:#d4a017; }
textarea { width:100%; height:170px; border:1px solid #444; border-radius:10px; background:#1e1e1e; color:#f5f0e6; padding:10px; font-size:14px; line-height:1.6; resize:vertical; font-family:inherit; }
.btn { display:block; width:100%; padding:13px; border:0; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; color:#fff; background-color:#a8760f; background-image:linear-gradient(135deg,#8a5a00,#d4a017); margin-top:10px; }
.btn.ghost { background-image:none; background-color:#333; color:#eee; }
.btn.green { background-image:linear-gradient(135deg,#1a7a3c,#2ecc71); }
.fields { display:block; }
.fields:after { content:""; display:table; clear:both; }
.field { float:left; width:50%; padding:4px; }
.field.full { float:none; width:100%; clear:both; }
.field > label { display:block; font-size:12px; color:#aaa; margin-bottom:3px; }
.field > input { width:100%; background:#1e1e1e; color:#f5f0e6; border:1px solid #444; border-radius:8px; padding:9px; font-size:14px; font-family:inherit; }
.field.hot > input { border-color:#d4a017; font-size:16px; font-weight:700; color:#ffd966; }
.field .sub { font-size:11px; color:#888; margin-top:3px; line-height:1.5; }
.live { display:block; margin:0 0 10px; font-size:14px; color:#ffd966; font-weight:700; }
.live input { width:18px; height:18px; vertical-align:middle; margin-right:6px; }
.rule { font-size:12px; color:#e6b566; background:#2a2211; border:1px solid #5a4310; border-radius:10px; padding:8px 10px; margin-bottom:10px; line-height:1.6; }
.preview-box { text-align:center; min-height:140px; }
.preview-box img { width:100%; max-width:340px; border-radius:10px; display:block; margin:0 auto; }
.hint { font-size:12px; color:#888; margin-top:8px; text-align:center; }
.msg { font-size:12px; color:#ff9c9c; margin-top:8px; text-align:center; word-break:break-all; }
.badge { display:inline-block; background:rgba(255,255,255,.2); border-radius:20px; padding:2px 10px; font-size:11px; margin-left:6px; }
</style>
</head>
<body>
<header>晒单海报生成器 <span class="badge">粘贴文本 → 手动填单数 → 出图</span></header>
<div class="wrap">
  <div class="card">
    <h2>① 粘贴晒单文本</h2>
    <textarea id="src"></textarea>
    <button class="btn" id="gen" type="button">解析文本（单数不自动识别）</button>
  </div>
  <div class="card">
    <h2>② 手动填写整体晒单数 + 核对信息</h2>
    <div class="rule">奖励规则：按<b>整体晒单数</b>（当天群里第几单，<b>需手动填写</b>，不从文本自动识别）—— 整体 1-5 单 = <b>18.8 元/单</b>，整体 6-30 单 = <b>8.8 元/单</b>。</div>
    <label class="live"><input type="checkbox" id="liveDate" checked> 日期实时（自动用今天，随手机日期变化）</label>
    <div class="fields" id="fields"></div>
    <button class="btn ghost" id="refresh" type="button">重新生成预览</button>
  </div>
  <div class="card">
    <h2>③ 生成结果</h2>
    <div class="preview-box"><img id="preview" alt="点上面按钮生成海报"></div>
    <button class="btn" id="save" type="button">保存图片（高清 JPG）</button>
    <button class="btn green" id="savePng" type="button">保存无损 PNG</button>
    <div class="hint">点击按钮直接下载高清图；手机浏览器也可长按预览图保存。</div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
var SW = 10799445, SH = 19079845, NAT_W = 1417, NAT_H = 2430;
var PREVIEW_SCALE = 0.6, EXPORT_SCALE = 2;
var ASSETS = { bg:'assets/bg.jpg', img3:'assets/banner.png', img4:'assets/badge.png' };
var GOLD_STOPS = [[0,'#FFC000'],[0.40,'#FFD966'],[0.87,'#FFF2CC']];
var NAME_STOPS = [[0,'#FEDE83'],[0.44,'#FEFFEE'],[0.72,'#E6BA75'],[1.0,'#FFFF92']];
var FONT_MAIN = '"Microsoft YaHei","微软雅黑","PingFang SC","Noto Sans CJK SC",sans-serif';
var FONT_BLACK = '"FZLanTingHeiS","方正兰亭大黑简体","Microsoft YaHei","微软雅黑",sans-serif';
var LAYOUT = {
  name:     { cx:5375592.5, cy:9609137.5, sz:11500, font:FONT_MAIN,  stops:NAME_STOPS },
  headline: { cx:5327967.5, cy:11558905,  sz:5205,  font:FONT_MAIN,  stops:GOLD_STOPS },
  amount:   { cx:4627880,   cy:14715490,  sz:19600, font:FONT_BLACK, stops:GOLD_STOPS },
  yuan:     { cx:8100377.5, cy:15200495,  sz:11300, font:FONT_BLACK, stops:GOLD_STOPS },
  date:     { cx:5461000,   cy:17814607.5,sz:4260,  font:FONT_MAIN,  stops:GOLD_STOPS }
};
var PIC_BANNER = { x:513715, y:4378960, w:10799445, h:3773805 };
var PIC_BADGE  = { x:191770, y:281305,  w:2828925,  h:920115 };
var LABELS = ['修改','县区','网格','发展人','办理日期','主卡号码','宽带号','实收月费','预存款','调测费','个人当日','宜州累计','要求'];

function pxX(e,s){ return e / SW * (NAT_W*s); }
function pxY(e,s){ return e / SH * (NAT_H*s); }
function fontPx(sz,s){ return (sz/100) * 12700 * (NAT_H*s/SH); }
function $(id){ return document.getElementById(id); }
function msg(t,ok){ var el=$('msg'); if(el){ el.textContent=t||''; el.style.color = ok ? '#8ee6a0' : '#ff9c9c'; } }
function firstNum(s){ var m=String(s||'').match(/\d+/); return m?m[0]:''; }

function parseText(txt){
  var f={},i,j; for(i=0;i<LABELS.length;i++){ f[LABELS[i]]=''; }
  var lines=String(txt||'').split(/\r?\n/);
  for(j=0;j<lines.length;j++){
    var m=lines[j].match(/^\s*([^:：\s]+)\s*[:：]\s*(.*)$/);
    if(!m) continue;
    var key=m[1].replace(/\s+/g,''), val=m[2].replace(/^\s+|\s+$/g,'');
    for(i=0;i<LABELS.length;i++){ if(key===LABELS[i]){ f[LABELS[i]]=val; break; } }
  }
  return f;
}
function normalizeDate(s){
  s=String(s||'').replace(/^\s+|\s+$/g,''); if(!s) return '';
  var m=s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日?$/); if(m) return m[1]+'年'+m[2]+'月'+m[3]+'日';
  m=s.match(/^(\d{1,2})月(\d{1,2})日?$/); if(m) return '2026年'+m[1]+'月'+m[2]+'日';
  m=s.match(/^(\d{1,2})[\.\/\-](\d{1,2})$/); if(m) return '2026年'+m[1]+'月'+m[2]+'日';
  return s;
}
function todayStr(){ var d=new Date(); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function rewardFor(o){ var n=parseInt(o||'0',10); if(n>=1&&n<=5) return '18.8'; if(n>=6) return '8.8'; return ''; }

function drawGradText(ctx,L,text,s){
  var cx=pxX(L.cx,s), cy=pxY(L.cy,s), size=fontPx(L.sz,s);
  ctx.font='bold '+size.toFixed(1)+'px '+L.font; ctx.textAlign='center'; ctx.textBaseline='middle';
  var mm=ctx.measureText(text);
  var asc=mm.actualBoundingBoxAscent||size*0.75, desc=mm.actualBoundingBoxDescent||size*0.25;
  var g=ctx.createLinearGradient(0,cy-asc,0,cy+desc);
  for(var i=0;i<L.stops.length;i++){ g.addColorStop(L.stops[i][0], L.stops[i][1]); }
  ctx.fillStyle=g; ctx.fillText(text,cx,cy);
}
function render(data,s){
  var c=document.createElement('canvas');
  c.width=Math.round(NAT_W*s); c.height=Math.round(NAT_H*s);
  var ctx=c.getContext('2d');
  if(imgs.bg) ctx.drawImage(imgs.bg,0,0,c.width,c.height);
  if(imgs.img3) ctx.drawImage(imgs.img3, pxX(PIC_BANNER.x,s),pxY(PIC_BANNER.y,s),pxX(PIC_BANNER.w,s),pxY(PIC_BANNER.h,s));
  if(imgs.img4) ctx.drawImage(imgs.img4, pxX(PIC_BADGE.x,s),pxY(PIC_BADGE.y,s),pxX(PIC_BADGE.w,s),pxY(PIC_BADGE.h,s));
  if(data.name)     drawGradText(ctx,LAYOUT.name,data.name,s);
  if(data.headline) drawGradText(ctx,LAYOUT.headline,data.headline,s);
  if(data.amount){  drawGradText(ctx,LAYOUT.amount,data.amount,s); drawGradText(ctx,LAYOUT.yuan,'元',s); }
  if(data.date)     drawGradText(ctx,LAYOUT.date,data.date,s);
  return c;
}
var imgs={}, imagesReady=false;
function loadImages(){
  var keys=['bg','img3','img4'];
  return Promise.all(keys.map(function(k){
    return new Promise(function(res){
      var im=new Image();
      im.onload=function(){ imgs[k]=im; res({k:k,ok:true}); };
      im.onerror=function(){ res({k:k,ok:false}); };
      im.src=ASSETS[k];
    });
  })).then(function(rs){
    var bad=[]; for(var i=0;i<rs.length;i++){ if(!rs[i].ok) bad.push(rs[i].k); }
    imagesReady=true;
    if(bad.length) msg('提示：部分模板图未加载('+bad.join(',')+')，其余功能正常');
    return bad;
  });
}
var FIELD_DEFS=[
  ['整体晒单数','整体晒单数','hot','手动填写：当天群里第几单（1-5 单 → 18.8 元，6-30 单 → 8.8 元）'],
  ['县区','县区'],['发展人','发展人'],['实收月费','实收月费'],['办理日期','办理日期'],
  ['奖励金额(自动)','reward','','按手动填写的整体晒单数自动计算'],
  ['个人当日','个人当日'],['宜州累计','宜州累计'],['网格','网格'],['主卡号码','主卡号码'],
  ['宽带号','宽带号'],['预存款','预存款'],['调测费','调测费']
];
function buildFields(f,prev){
  var el=$('fields'); el.innerHTML='';
  var map={};
  for(var i=0;i<FIELD_DEFS.length;i++){
    var def=FIELD_DEFS[i], label=def[0], key=def[1], cls=def[2]||'', hint=def[3]||'';
    var wrap=document.createElement('div');
    wrap.className='field'+(cls==='hot'?' full hot':'');
    var lb=document.createElement('label'); lb.appendChild(document.createTextNode(label));
    var inp=document.createElement('input'); inp.type='text'; inp.setAttribute('data-key',key);
    if(key==='reward'){
      var ov=(prev&&prev['整体晒单数'])?prev['整体晒单数'].value:'';
      inp.value=rewardFor(firstNum(ov)); inp.readOnly=true; map.reward=inp;
    } else if(key==='整体晒单数'){
      inp.value=(prev&&prev['整体晒单数'])?prev['整体晒单数'].value:'';
      inp.placeholder='例如：7'; map[key]=inp;
    } else { inp.value=f[key]||''; map[key]=inp; }
    wrap.appendChild(lb); wrap.appendChild(inp);
    if(hint){ var s=document.createElement('div'); s.className='sub'; s.appendChild(document.createTextNode(hint)); wrap.appendChild(s); }
    el.appendChild(wrap);
  }
  return map;
}
function collectAndDerive(){
  var srcEl=$('src');
  var f=parseText(srcEl?srcEl.value:'');
  var e=window._fieldMap||{}, merged={}, k;
  for(k in f){ merged[k]=f[k]; }
  for(k in e){ if(e[k]&&!e[k].readOnly){ merged[k]=String(e[k].value).replace(/^\s+|\s+$/g,''); } }
  var liveEl=$('liveDate');
  var overall=firstNum(merged['整体晒单数']);
  var reward=rewardFor(overall);
  if(e.reward) e.reward.value=reward;
  return {
    amount: reward,
    name: (merged['县区']||'')+(merged['发展人']||''),
    headline: overall ? ('——宽融≥139 第'+overall+'单——') : '——宽融≥139——',
    date: (liveEl&&liveEl.checked) ? todayStr() : normalizeDate(merged['办理日期'])
  };
}
function doRender(){
  var d=collectAndDerive();
  if(!imagesReady){ msg('正在加载模板图…表单可先填写'); return d; }
  try{
    var u=render(d,PREVIEW_SCALE).toDataURL('image/jpeg',0.9);
    $('preview').src=u;
    msg('预览已更新（导出高清 2834×4860）', true);
  }catch(err){ msg('预览生成失败：'+err); }
  return d;
}
function exportCanvas(){
  var d=collectAndDerive(), scales=[EXPORT_SCALE,1.5,1];
  for(var i=0;i<scales.length;i++){ try{ return render(d,scales[i]); }catch(e){} }
  return null;
}
function saveImage(type){
  msg('正在生成高清图…', true);
  setTimeout(function(){
    try{
      var c=exportCanvas();
      if(!c){ msg('生成失败：设备内存不足，请重试'); return; }
      var url=(type==='png')?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.92);
      var a=document.createElement('a');
      a.href=url; a.download='晒单海报_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+(type==='png'?'.png':'.jpg');
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      msg('已生成 '+c.width+'×'+c.height+' 图片，开始下载…', true);
    }catch(err){ msg('保存失败：'+err); }
  },30);
}
function bind(){
  $('gen').onclick=function(){ var f=parseText($('src').value); window._fieldMap=buildFields(f,window._fieldMap); doRender(); };
  $('refresh').onclick=function(){ doRender(); };
  $('save').onclick=function(){ saveImage('jpg'); };
  $('savePng').onclick=function(){ saveImage('png'); };
  var ld=$('liveDate'); if(ld){ ld.onchange=function(){ doRender(); }; }
}
function boot(){
  var srcEl=$('src');
  if(srcEl && !srcEl.value){ srcEl.value="修改：2026年10月晒单\n县区：宜州\n网格: 城东支局\n发展人:罗彩叠\n办理日期：10月16日\n主卡号码 :7868\n宽带号: 077802280957\n实收月费:139组网\n预存款：200\n调测费:   200\n个人当日：第 1单\n宜州累计：第 7单\n要求：当日新发展139元及以上组网牛鼻子，在“2026年四季度营销晒单群”晒单，每天1-5单奖励18.8元/单，第6-30单奖励8.8元/单。"; }
  var f=parseText(srcEl?srcEl.value:'');
  window._fieldMap=buildFields(f,null);
  bind();
  msg('正在加载模板图…');
  loadImages().then(function(){ doRender(); })
    .catch(function(err){ msg('模板图加载失败：'+err+'（表单仍可用）'); });
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',boot); } else { boot(); }
</script>
</body>
</html>
